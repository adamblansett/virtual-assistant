services:
  virtual-assistant-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtual_assistant_web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - OPEN_WEIGHT_MODEL=${OPEN_WEIGHT_MODEL:-qwen2.5:14b}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/integrations/gmail/callback}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  virtual-assistant-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtual_assistant_scheduler
    restart: unless-stopped
    command: ["sh", "-c", "while true; do npm run scheduler; sleep 300; done"]
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - OPEN_WEIGHT_MODEL=${OPEN_WEIGHT_MODEL:-qwen2.5:14b}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./data:/app/data
    depends_on:
      - virtual-assistant-web

  ollama:
    image: ollama/ollama:latest
    container_name: virtual_assistant_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  data:
    driver: local
  ollama_data:
    driver: local
